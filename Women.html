<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Cage Called Society</title>

<style>
body{
    margin:0;
    background:#000;
    text-align:center;
    font-family:Arial,sans-serif;
}

#pageImage{
    width:100%;
    max-width:900px;
    display:block;
    margin:auto;
}

.buttons{
    display:flex;
    justify-content:space-between;
    max-width:900px;
    margin:20px auto;
    padding:0 15px 25px;
}

button{
    background:#111;
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:12px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#333;
}

button:disabled{
    background:#666;
    cursor:not-allowed;
    opacity:.7;
}
</style>

</head>

<body>

<img id="pageImage" src="" alt="Book Page">

<div class="buttons">
<button id="prevBtn">← Previous</button>
<button id="nextBtn">Next →</button>
</div>

<script>

const pages = [

"Brown Vintage Book Page Border_20260918_003206_0000.png",

"Brown Vintage Book Page Border_20260918_004117_0000.png",

"Brown Vintage Book Page Border_20260918_012647_0000.png",

"Brown Vintage Book Page Border_20260918_014127_0000.png",

"Brown Vintage Book Page Border_20260918_015148_0000.png",

"Brown Vintage Book Page Border_20260918_023216_0000.png",

"Brown Vintage Book Page Border_20260918_024103_0000.png",

"Brown Vintage Book Page Border_20260918_035728_0000.png",

"Brown Vintage Book Page Border_20260918_040436_0000.png",

"Brown Vintage Book Page Border_20260918_041126_0000.png",

"Brown Vintage Book Page Border_20260918_042731_0000.png",

"Brown Vintage Book Page Border_20260918_043345_0000.png",

"Brown Vintage Book Page Border_20260918_044328_0000.png",

"Brown Vintage Book Page Border_20260918_045703_0000.png",

"Brown Vintage Book Page Border_20260918_051127_0000.png",

"Brown Vintage Book Page Border_20260918_090249_0000.png",

"Brown Vintage Book Page Border_20260918_091208_0000.png",

];

let currentPage = 0;

const img = document.getElementById("pageImage");
const prev = document.getElementById("prevBtn");
const next = document.getElementById("nextBtn");

function showPage(){

img.src = pages[currentPage];

prev.disabled = currentPage === 0;
next.disabled = currentPage === pages.length - 1;

}

prev.onclick = function(){

if(currentPage > 0){

currentPage--;
showPage();

}

}

next.onclick = function(){

if(currentPage < pages.length - 1){

currentPage++;
showPage();

}

}

showPage();

</script>

</body>
</html>
